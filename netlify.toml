[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Prisma Client, the pg adapter, and native drivers cannot be bundled by esbuild.
  # They're kept as external require() calls and included in the function zip via node_modules.
  external_node_modules = ["@prisma/client", "@prisma/adapter-pg", "pg", "pg-native", "bufferutil", "utf-8-validate"]

[functions."api"]
  included_files = [
    "server/**/*.ts",
    "server/**/*.js",
    "src/generated/prisma/**",
    "prisma.config.ts",
    "prisma/schema.prisma",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
