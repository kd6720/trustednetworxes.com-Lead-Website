[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # The build emits netlify/functions/api.mjs as a single self-contained ESM
  # bundle (scripts/build-function.mjs), so no server-side bundling is needed.
  node_bundler = "none"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
