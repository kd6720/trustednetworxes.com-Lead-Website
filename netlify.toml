[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # esbuild bundles all JS into a single file, keeping only native modules external
  node_bundler = "esbuild"
  external_node_modules = ["pg", "pg-*", "bcryptjs", "@prisma/adapter-pg"]

[functions."api"]
  included_files = [
    "dist-server/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**",
    "node_modules/@prisma/adapter-pg/**",
    "node_modules/pg/**",
    "node_modules/pg-*/**",
    "node_modules/bcryptjs/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
